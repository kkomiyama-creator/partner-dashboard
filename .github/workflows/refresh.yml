name: refresh-dashboard

on:
  schedule:
    # 5分おきに起動する。実際に平日8-20時(JST)かどうかはci_refresh.py内で判定してスキップする
    # (cronはUTCのみ・曜日境界がJSTとズレるため、時間帯の判定はPython側に寄せる)。
    # 2026-08-20: 初回pushから1時間近くscheduleトリガーが一度も発火しなかったため、
    # ワークフローファイル自体を再pushしてGitHub側のスケジューラ登録を再トリガーする。
    # 2026-08-27: 8/26 21時台(JST)を最後にscheduleが約5時間発火しなくなる事象を再確認。
    # 同じ再push手当てで復旧させる（GitHub Actions側のスケジューラ登録が不安定になる既知の癖）。
    # 2026-08-31: 実測で「5分おき」のはずが実際は2〜5時間おきにしか発火していないと判明
    # （GitHub側がちょうど毎時0/5/10...分という混雑しやすい時刻のscheduleを間引く既知の弱点）。
    # 分をずらす（毎時ちょうどを避ける）ことで混雑を回避し、あわせて keepalive.yml
    # （オフセットした別周期でstaleなら再発火する自己復旧ジョブ）を追加した。
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet google-api-python-client google-auth google-auth-oauthlib requests

      - name: Run refresh pipeline
        env:
          CYZEN_DASHBOARD_TOKEN: ${{ secrets.CYZEN_DASHBOARD_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python3 automation/ci_refresh.py

      - name: Commit and push if changed
        run: |
          git config user.email "dashboard-bot@fit-founder.net"
          git config user.name "Dashboard Bot (GitHub Actions)"
          git add index.html
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "auto-update dashboard (GitHub Actions)"
            git push
          fi
